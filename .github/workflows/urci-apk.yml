name: URCI Field APK
on:
  push:
    paths:
      - 'urci-app/**'
      - '.github/workflows/urci-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urci-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: urci-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install web deps
        run: npm ci
      - name: Vendor @capacitor/core and jsPDF
        run: node scripts/vendor.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: urci-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rehearse the signed release build (throwaway key, not published)
        working-directory: urci-app/android
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/rehearsal.jks" -storetype PKCS12 -alias rehearsal -keyalg RSA -keysize 2048 \
            -validity 1 -storepass rehearsal -keypass rehearsal -dname "CN=rehearsal" >/dev/null
          URCI_KEYSTORE_FILE="$RUNNER_TEMP/rehearsal.jks" URCI_KEYSTORE_PASSWORD=rehearsal URCI_KEY_ALIAS=rehearsal URCI_KEY_PASSWORD=rehearsal \
            ./gradlew assembleRelease --no-daemon
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -q 'CN=rehearsal'
          if "$BT/aapt" dump badging "$APK" | grep -q application-debuggable; then echo "::error::release APK is debuggable"; exit 1; fi
          "$BT/aapt" dump badging "$APK" | grep -m1 '^package:'
          rm -f "$RUNNER_TEMP/rehearsal.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: urci-field-debug-apk
          path: urci-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
