name: urci-tests
on:
  push:
    paths: ['urci-app/**', 'docs/designs/curves/**', '.github/workflows/urci-tests.yml']
  pull_request:
    paths: ['urci-app/**', 'docs/designs/curves/**']
jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urci-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: urci-app/package-lock.json
      - run: npm ci
      - name: poppler (PDF text checks)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm test
      - name: Curve anchors (reconciled curves)
        run: python3 ../docs/designs/curves/validate.py ../docs/designs/curves/curves.reconciled.json
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urci-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: urci-app/package-lock.json
      - run: npm ci
      - run: node scripts/vendor.mjs
      - name: Inspect UI at 360 dp, font scale 1.0 and 1.3
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node test/ui/inspect.ui.cjs
          node test/ui/native-boot.ui.cjs
          node test/ui/history.ui.cjs
          node test/ui/files.ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect-ui-screenshot
          path: urci-app/test/ui/*.png
          if-no-files-found: ignore
